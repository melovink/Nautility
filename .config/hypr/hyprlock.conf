source = $HOME/.config/hypr/everforest.conf
source = ~/.cache/wal/colors-kitty.conf

$font = JetBrainsMono Nerd Font

# GENERAL
general {
  hide_cursor = true
}

# BACKGROUND
background {
  path = /home/melovink/nordic-wallpapers/wallpapers/nordic-obsession.png
  blur_passes = 0
  blur_size = 0
}

